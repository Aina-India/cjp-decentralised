name: Build and compute IPFS CID

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go tests (mirror + publisher)
        run: |
          (cd packages/mirror && go test ./...)
          (cd packages/publisher && go test ./...)

      - name: JS verify-logic tests
        run: node packages/site/test/verify-logic.test.mjs

      - name: JS NIP-13 PoW tests
        run: node packages/site/test/pow-nip13.test.mjs

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: node scripts/build.js

      - name: Assert verify.js is loaded as an ES module
        # Gate-3 safety net: verify.js uses `import`, so any page that loads it
        # MUST use type="module" or the badge silently breaks (a classic script
        # with `import` is a SyntaxError). Fails loudly if a future templating
        # change (#16) ever drops the attribute.
        run: |
          if grep -rEn '<script[^>]*src="[^"]*verify\.js"' dist/ --include='*.html' | grep -v 'type="module"'; then
            echo "::error::found a verify.js <script> tag without type=\"module\" in dist/"
            exit 1
          fi
          echo "All verify.js script tags use type=module."

      - name: Compute IPFS CID
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          wget -qO- https://dist.ipfs.tech/kubo/v0.29.0/kubo_v0.29.0_linux-amd64.tar.gz | tar -xz
          ./kubo/ipfs init --empty-repo -p test 2>/dev/null
          CID=$(./kubo/ipfs add --only-hash -r --cid-version=1 --quieter dist/)
          echo "## IPFS CID" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$CID" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Sign it: \`publisher sign --key ~/.cjp/signing.key --cid $CID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Then pin from any IPFS node: \`ipfs pin add $CID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 7
