services:
  ipfs:
    # Pinned to digest on 2026-06-27; bump via: docker pull ipfs/kubo:latest && docker inspect --format='{{index .RepoDigests 0}}' ipfs/kubo:latest
    image: ipfs/kubo:latest@sha256:8907cb0cc1ad5798f6bb1bb1341a800990c268e021cedfa317e8aa1a33864214
    restart: unless-stopped
    ports:
      - "4001:4001"   # swarm
      - "127.0.0.1:5001:5001"  # API (local only)
      - "127.0.0.1:8082:8080"  # gateway (local only)
    environment:
      # Set MIRROR_HOST to the hostname your nginx reverse proxy serves on
      # (e.g. cjp.example.com). The init script then configures kubo for
      # path-mode gateway serving so /ipfs/<CID> works without subdomain
      # redirects. Leave blank if you only use the gateway internally.
      MIRROR_HOST: "${MIRROR_HOST:-}"
    volumes:
      - ipfs_data:/data/ipfs
      - ./scripts/ipfs-init-public-gateway.sh:/container-init.d/01-public-gateway.sh:ro

  # Bundled strfry relay. Mirror daemon writes heartbeats here first
  # (guaranteed local success), then to public relays for federation.
  # Browsers discover this relay from heartbeats via MIRROR_RELAY_URL.
  relay:
    # Pinned to digest on 2026-06-27; bump via: docker pull dockurr/strfry:latest && docker inspect --format='{{index .RepoDigests 0}}' dockurr/strfry:latest
    image: dockurr/strfry:latest@sha256:545555da5dd2c2b502f2c0d159f4dc4996d0e488e3bf25905ce881722d63d2c5
    restart: unless-stopped
    volumes:
      - ./strfry.conf:/etc/strfry.conf:ro
      - relay_data:/app/strfry-db

  mirror:
    build:
      context: ./packages/mirror
    restart: unless-stopped
    depends_on:
      - ipfs
      - relay
    environment:
      IPFS_API: "http://ipfs:5001"
      IPFS_GATEWAY: "http://ipfs:8080"
      POLL_INTERVAL: "900"  # seconds
      SERVE_DIR: "/var/cjp/html"
      # Local relay — always-success target so daemon liveness doesn't depend
      # on any public relay being reachable.
      LOCAL_RELAY: "ws://relay:7777"
      # Public wss:// URL of the bundled relay (advertised in heartbeats so
      # visitors discover it). Typically wss://<MIRROR_HOST>/relay.
      MIRROR_RELAY_URL: "${MIRROR_RELAY_URL:-}"
      # ISO country code shown next to this mirror in the live list.
      COUNTRY: "${COUNTRY:-}"
    volumes:
      - ./trusted-signers.json:/app/trusted-signers.json:ro
      - ./latest.json:/app/latest.json:ro
      - html_data:/var/cjp/html

  nginx:
    # Pinned to digest on 2026-06-27; bump via: docker pull nginx:alpine && docker inspect --format='{{index .RepoDigests 0}}' nginx:alpine
    image: nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    restart: unless-stopped
    depends_on:
      - relay
    expose:
      - "80"
    volumes:
      - html_data:/var/cjp/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Caddy fronts nginx with automatic Let's Encrypt TLS. When MIRROR_HOST is
  # set (recommended for public mirrors), Caddy provisions a real cert and
  # redirects HTTP → HTTPS. When unset, Caddy just serves HTTP on :80 —
  # useful for local testing or when the operator has their own reverse
  # proxy in front of this stack.
  caddy:
    # Pinned to digest on 2026-06-27; bump via: docker pull caddy:2-alpine && docker inspect --format='{{index .RepoDigests 0}}' caddy:2-alpine
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      MIRROR_HOST: "${MIRROR_HOST:-}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  tor:
    # Pinned to digest on 2026-06-27; bump via: docker pull dperson/torproxy:latest && docker inspect --format='{{index .RepoDigests 0}}' dperson/torproxy:latest
    image: dperson/torproxy:latest@sha256:d8b5f1cf24f1b7a0aa334929a264b2606a107223dd0d51eb1cda8aae6fbeec53
    restart: unless-stopped
    environment:
      - HIDDEN_SERVICE=nginx:80
    volumes:
      - tor_data:/var/lib/tor

volumes:
  ipfs_data:
  html_data:
  tor_data:
  relay_data:
  caddy_data:
  caddy_config:
